<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gia Hân ❤️</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
}
canvas{
    position:absolute;
    width:100%;
    height:100%;
}
h1{
    position:absolute;
    width:100%;
    top:10%;
    text-align:center;
    color:#00ffff;
    font-size:36px;
}
</style>
</head>

<body>

<h1>Gia Hân ❤️</h1>
<canvas id="pinkboard"></canvas>
<audio id="voice" src="voice.mp4"></audio>

<script>
var settings={
    particles:{
        length:2500,
        duration:2.5,
        velocity:100,
        effect:-1,
        size:8
    }
};

let mode="heart";
let startTime=Date.now();
let imagePoints=[];

// 👉 click phát nhạc
document.body.addEventListener("click",()=>{
    document.getElementById("voice").play();
},{once:true});

// ===== LOAD ẢNH =====
const image=new Image();
image.src="image.png";

image.onload=function(){
    createImagePoints();
    setTimeout(()=>mode="image",2000);
};

function Point(x,y){
    this.x=x||0;
    this.y=y||0;
}
Point.prototype.clone=function(){return new Point(this.x,this.y);};
Point.prototype.length=function(l){
    if(l===undefined)return Math.sqrt(this.x*this.x+this.y*this.y);
    this.normalize();this.x*=l;this.y*=l;return this;
};
Point.prototype.normalize=function(){
    let l=this.length();
    this.x/=l;this.y/=l;
    return this;
};

// ===== FIX IMAGE POINTS (QUAN TRỌNG) =====
function createImagePoints(){

    let c=document.createElement("canvas");
    let ctx=c.getContext("2d");

    c.width=300;
    c.height=300;

    ctx.drawImage(image,0,0,300,300);

    let data=ctx.getImageData(0,0,300,300).data;

    imagePoints=[];

    for(let y=0;y<300;y+=2){
        for(let x=0;x<300;x+=2){

            let i=(y*300+x)*4;

            let r=data[i];
            let g=data[i+1];
            let b=data[i+2];
            let a=data[i+3];

            let brightness=(r+g+b)/3;

            // 🔥 lọc nền trắng + giữ biên dạng
            let contrast=Math.max(r,g,b)-Math.min(r,g,b);

            if(a>50 && brightness<245 && contrast>15){
                imagePoints.push(new Point(x-150,150-y));
            }
        }
    }

    // 🔥 giảm block vuông
    imagePoints=imagePoints.filter((_,i)=>i%3===0);

    console.log("POINTS:",imagePoints.length);
}

// ===== HEART SHAPE =====
function heart(t){
    return new Point(
        160*Math.pow(Math.sin(t),3),
        130*Math.cos(t)-50*Math.cos(2*t)
        -20*Math.cos(3*t)-10*Math.cos(4*t)+25
    );
}

// ===== RENDER =====
(function(canvas){

let ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
window.onresize=resize;
resize();

function draw(){
    requestAnimationFrame(draw);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let t=(Date.now()-startTime)/1000;

    let count=20;

    for(let i=0;i<count;i++){

        let p;

        if(mode==="heart"){
            p=heart(Math.PI*2*Math.random());
        }else{
            if(imagePoints.length===0)continue;
            p=imagePoints[Math.floor(Math.random()*imagePoints.length)];
        }

        ctx.fillStyle="#00ffff";
        ctx.fillRect(
            canvas.width/2+p.x,
            canvas.height/2-p.y,
            2,2
        );
    }
}

draw();

})(document.getElementById("pinkboard"));
</script>

</body>
</html>
