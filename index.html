<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Heart to Image</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:#000;
}
canvas{
position:absolute;
width:100%;
height:100%;
}
h1{
position:absolute;
width:100%;
top:10%;
text-align:center;
color:#00ffff;
font-size:32px;
}
</style>
</head>

<body>

<h1>Gia Hân ❤️</h1>
<canvas id="c"></canvas>
<audio id="voice" src="voice.mp4"></audio>

<script>

let canvas=document.getElementById("c");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let mode="heart";
let start=Date.now();
let points=[];

// click phát nhạc
document.body.onclick=()=>document.getElementById("voice").play();

let img=new Image();
img.src="image.png";

img.onload=()=>{
    buildImage();
    setTimeout(()=>mode="image",2000);
};

// ===== POINT =====
function Point(x,y){this.x=x;this.y=y;}

// ===== HEART =====
function heart(t){
return {
x:160*Math.pow(Math.sin(t),3),
y:130*Math.cos(t)-50*Math.cos(2*t)-20*Math.cos(3*t)
};
}

// ===== FIX IMAGE (CHỐNG HÌNH VUÔNG) =====
function buildImage(){

let c=document.createElement("canvas");
let g=c.getContext("2d");

c.width=300;
c.height=300;

g.drawImage(img,0,0,300,300);

let d=g.getImageData(0,0,300,300).data;

points=[];

for(let y=0;y<300;y+=2){
for(let x=0;x<300;x+=2){

let i=(y*300+x)*4;

let r=d[i],g2=d[i+1],b=d[i+2];

let bright=(r+g2+b)/3;

// 🔥 chỉ lấy pixel “thật của hình”
if(bright<240){
points.push({
x:x-150,
y:150-y
});
}
}
}

// giảm block vuông
points=points.filter((_,i)=>i%3===0);

console.log("POINTS",points.length);
}

// ===== RENDER =====
function draw(){

requestAnimationFrame(draw);

ctx.clearRect(0,0,canvas.width,canvas.height);

let t=(Date.now()-start)/1000;

for(let i=0;i<25;i++){

let p;

if(mode==="heart"){
p=heart(Math.random()*Math.PI*2);
}else{
if(points.length===0)continue;
p=points[Math.floor(Math.random()*points.length)];
}

ctx.fillStyle="#00ffff";

ctx.fillRect(
canvas.width/2+p.x,
canvas.height/2-p.y,
2,2
);
}
}

draw();

</script>

</body>
</html>
